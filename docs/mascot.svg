  <path d="M150 84C162 50 202 48 214 82 190 72 168 74 150 84Z" fill="#8C6240"/>

  <path d="M118 118C114 80 166 66 216 72 254 76 282 100 278 128 274 156 240 174 194 178 146 182 116 164 112 142 108 128 112 120 118 118Z" fill="#C4956A"/>
  <path d="M156 152C192 168 232 162 254 146 222 158 186 164 156 152Z" fill="#E8C9A4"/>

  <ellipse cx="140" cy="116" rx="10" ry="7" fill="#5C3A24"/>
