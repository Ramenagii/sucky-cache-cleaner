      <ellipse class="glint" cx="234" cy="100" rx="2.2" ry="2.2" fill="#FFFFFF"/>
    </g>
    <path class="lid fx" opacity="0" d="M215 102c5 10 22 10 26 0" stroke="#141414" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <path class="brow fx" opacity="0" d="M214 82c7-6 20-5 28 2" stroke="#141414" stroke-width="3.5" stroke-linecap="round"/>

  <path class="mouth mouth-idle" d="M212 124c7 10 24 10 32 0" stroke="#141414" stroke-width="4" stroke-linecap="round"/>
  <path class="mouth mouth-happy" opacity="0" d="M208 122c8 12 32 12 40 0" stroke="#141414" stroke-width="4" stroke-linecap="round"/>
  <path class="mouth mouth-worry" opacity="0" d="M214 134c6-6 22-6 28 0" stroke="#141414" stroke-width="4" stroke-linecap="round"/>
  <ellipse class="mouth mouth-scan" opacity="0" cx="228" cy="130" rx="5" ry="4" fill="#141414"/>

  <path d="M244 124c12 3 20 8 26 16" stroke="#5C3A24" stroke-width="2.5" stroke-linecap="round"/>
