      <rect x="0" y="-5" width="34" height="10" rx="5" fill="#8C6240"/>
      <rect x="26" y="-8" width="14" height="16" rx="3" fill="#C2410C"/>
      <rect x="38" y="-11" width="26" height="22" rx="8" fill="#F4E4C8"/>
      <g class="suds">
        <circle cx="60" cy="-4" r="6" fill="#FFFFFF"/>
        <circle cx="54" cy="6" r="4" fill="#FFFFFF"/>
        <circle cx="66" cy="5" r="3" fill="#FFFFFF"/>
