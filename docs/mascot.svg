  <path class="flame" d="M215 144c-1 2 0 4 1 5 1-2 2-2 2-3 0-1-2-2-3-2Z" fill="#FF9E00"/>

  <!-- blunt scrub head, hanging clear of the bib -->
  <g transform="translate(150,166) rotate(48)">
