[package]
name = "rush-button"
version = "0.1.0"
edition = "2021"
description = "One-button cache cleaner for Rush.js monorepos and common dev caches"

[dependencies]
eframe = "0.31"
walkdir = "2"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
